<!DOCTYPE html>
<!-- Shown by the router after a successful login (VERIFY-ON-HARDWARE: that alogin.html is served here and $(link-redirect) is the page the member asked for). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="pragma" content="no-cache">
<title>Connected</title>
<noscript><meta http-equiv="refresh" content="2; url=$(link-redirect)"></noscript>
</head>
<body style="font-family: system-ui, sans-serif; text-align: center; padding: 48px 16px;">
<p>You are connected. <a id="continue" href="$(link-redirect)">Continue</a></p>
<script>
// The usual "is the internet really there?" requests that make phones close the captive-portal window.
(function () {
  var targets = ["https://www.google.com/", "https://www.apple.com/"];
  for (var i = 0; i < targets.length; i++) {
    try { fetch(targets[i], { mode: "no-cors", cache: "no-store" }).catch(function () {}); } catch (e) {}
  }
  setTimeout(function () { window.location.replace(document.getElementById("continue").href); }, 1500);
})();
</script>
</body>
</html>
