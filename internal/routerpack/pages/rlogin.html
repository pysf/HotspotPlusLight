<!DOCTYPE html>
<!-- Served when an unauthenticated client asks for any page: sends it to the login page.
     The legacy version redirected to an external portal with the password in the URL; this one does not.
     VERIFY-ON-HARDWARE: $(link-login-only) and $(link-orig-esc). -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="refresh" content="0; url=$(link-login-only)?dst=$(link-orig-esc)">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Login required</title>
</head>
<body></body>
</html>
