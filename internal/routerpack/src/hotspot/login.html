<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="pragma" content="no-cache">
<meta http-equiv="expires" content="-1">
<title>Wi-Fi sign in</title>
<link rel="stylesheet" href="css/hotspot.css">
<script src="js/busy.js" defer></script>
</head>
<body data-theme="@THEME@">

<main class="page">
  <div class="card">
    <header class="hero">
      <!-- LOGO: the default Wi-Fi mark is below. To use your own logo, upload it to the hotspot folder
           as img/logo.png and replace the whole div with: <div class="logo"><img src="img/logo.png" alt=""></div>
           (or delete the div for a text-only page). -->
      <div class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24"><path d="M2 8.8a15 15 0 0 1 20 0M5 12.5a10 10 0 0 1 14 0M8.5 16.1a5 5 0 0 1 7 0"/><circle cx="12" cy="19.5" r="1.3"/></svg>
      </div>
      <!-- HEADING: change the text of the h1 below. -->
      <h1>Welcome</h1>
      <!-- SUBTITLE: change the text of the next line. -->
      <p class="sub">Sign in with the details from reception to get online.</p>
    </header>

    <!-- The form posts to the hotspot. Keep the action, the field names and the two hidden fields as they are. -->
    <form action="$(link-login-only)" method="post" autocomplete="on" data-busy>
      <input type="hidden" name="dst" value="$(link-orig)">
      <input type="hidden" name="popup" value="false">
      <label class="field"><span>Username</span>
        <input name="username" type="text" value="$(username)" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required>
      </label>
      <label class="field"><span>Password</span>
        <input name="password" type="password" autocomplete="current-password" required>
      </label>
$(if error)
      <p class="err" role="alert">
<!-- MESSAGES - translate here.
     The server sends only a short code when it rejects a login. Each line below turns one code into
     the text the guest sees. Change the English text to another language, or to your own words.
     Do not change the codes in capital letters. The last line shows any other message from the router as it is. -->
@MESSAGES@
      </p>
$(endif)
      <button class="btn" type="submit">Log in</button>
    </form>
  </div>
</main>

</body>
</html>
