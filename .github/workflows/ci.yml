name: ci
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)"
      - name: vet
        run: go vet ./...
      - name: test (race)
        if: runner.os == 'Linux'
        run: go test -race -count=1 -timeout 30m ./... # the e2e suite is slow under the race detector
      # The race detector needs cgo on Windows, so it is not used there.
      - name: test
        if: runner.os == 'Windows'
        run: go test -count=1 -timeout 30m ./...
        env:
          HSP_TEST_WINDOWS_SERVICE: "1" # E11.33: the runner is Administrator

  # Catches a platform that no longer builds. Same list as `make release`.
  cross-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: build all 9 platforms
        run: make build-cross VERSION=ci

  # Only a warning, never a failure: old commits and merge commits do not follow
  # the style, and a hard fail would block pushes. The warning shows in the run.
  commit-style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: check the last commit subject
        run: |
          subject=$(git log -1 --format=%s)
          if ! printf '%s\n' "$subject" | grep -Eq '^[a-z]+(\([^)]*\))?!?: .+'; then
            echo "::warning title=Commit style::Subject should be 'type(scope)?: text' (feat, fix, docs, chore, test, site, ci, refactor, build, style, perf). Without feat or fix there is no release. Got: ${subject}"
          fi
